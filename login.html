<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OUD Markets — Student Login</title>
<style>
:root{--bg:#050506;--fg:#f7f7f8;--muted:#9a9aa2;--lav:#cbbaff;--line:#ffffff14}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(800px 500px at 50% -5%,#cbbaff18,transparent 70%),#050506;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}.nav{height:58px;position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(1120px,calc(100% - 32px));display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 20px;border:1px solid var(--line);border-radius:18px;background:#111115c9;backdrop-filter:blur(28px);z-index:5}.logo{font-size:12px;font-weight:800;letter-spacing:.22em}.logo span{color:var(--lav)}.back{font-size:11px;color:#a7a7ae}
main{min-height:100vh;display:grid;place-items:center;padding:110px 20px 50px}.card{width:min(460px,100%);padding:42px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,#121216e8,#09090bf0);box-shadow:0 35px 110px #000b,inset 0 1px #fff2}.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:9px;color:#aaa7b1;font-weight:800}.card h1{font-size:46px;letter-spacing:-.06em;line-height:.95;margin:14px 0}.sub{color:var(--muted);line-height:1.6;font-size:14px;margin-bottom:30px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;background:#ffffff07;border:1px solid #ffffff0d;border-radius:13px;margin-bottom:22px}.tab{border:0;background:transparent;color:#888892;padding:11px;border-radius:9px;font-weight:700;cursor:pointer}.tab.active{background:#f4efff;color:#16111e}.field{margin:13px 0}.field label{display:block;font-size:10px;color:#92929a;margin:0 0 7px;letter-spacing:.08em}.field input{width:100%;height:48px;border:1px solid #ffffff12;border-radius:13px;background:#ffffff07;color:#fff;padding:0 14px;outline:none}.field input:focus{border-color:#cbbaff55;box-shadow:0 0 0 3px #cbbaff0b}.submit{width:100%;height:50px;border:0;border-radius:14px;background:linear-gradient(180deg,#ded6ef,#b9a9e3);color:#0c0a10;font-weight:800;cursor:pointer;margin-top:8px}.submit:disabled{opacity:.6;cursor:wait}.status{min-height:20px;margin-top:15px;font-size:12px;color:#aaaab1;line-height:1.5}.status.ok{color:#cbbaff}.small{margin-top:22px;color:#6f6f78;font-size:10px;line-height:1.6}
@media(max-width:600px){.card{padding:30px 22px}.card h1{font-size:40px}}
</style>
</head>
<body>
<nav class="nav"><a class="logo" href="index.html">OUD <span>MARKETS</span></a><a class="back" href="index.html">← Back to site</a></nav>
<main><section class="card">
<div class="eyebrow">Student access</div>
<h1 id="heading">Welcome back.</h1>
<p class="sub" id="sub">Sign in to continue your OUD Markets education.</p>
<div class="tabs"><button class="tab active" id="loginTab">Sign in</button><button class="tab" id="signupTab">Create account</button></div>
<form id="authForm">
<div class="field"><label for="email">EMAIL</label><input id="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div>
<button class="submit" id="submit" type="submit">Sign in</button>
</form>
<div class="status" id="status"></div>
<div class="small">Educational platform only. Trading involves risk and OUD Markets does not guarantee trading profits.</div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const configured = window.OUD_SUPABASE_URL && !window.OUD_SUPABASE_URL.startsWith("YOUR_") && window.OUD_SUPABASE_PUBLISHABLE_KEY && !window.OUD_SUPABASE_PUBLISHABLE_KEY.startsWith("YOUR_");
const statusEl=document.getElementById("status"), form=document.getElementById("authForm"), submit=document.getElementById("submit");
let mode="login";
const loginTab=document.getElementById("loginTab"), signupTab=document.getElementById("signupTab");
function setMode(next){mode=next;loginTab.classList.toggle("active",mode==="login");signupTab.classList.toggle("active",mode==="signup");document.getElementById("heading").textContent=mode==="login"?"Welcome back.":"Create your account.";document.getElementById("sub").textContent=mode==="login"?"Sign in to continue your OUD Markets education.":"Create your student account. We'll use it for course access and progress.";submit.textContent=mode==="login"?"Sign in":"Create account";statusEl.textContent=""}
loginTab.onclick=()=>setMode("login");signupTab.onclick=()=>setMode("signup");
if(!configured){statusEl.textContent="Supabase is not connected yet. Add your Project URL and Publishable Key in supabase-config.js.";submit.disabled=true;}
else {
  const {createClient}=supabase; window.oudSupabase=createClient(window.OUD_SUPABASE_URL,window.OUD_SUPABASE_PUBLISHABLE_KEY);
  window.oudSupabase.auth.getSession().then(({data})=>{if(data.session) location.href="dashboard.html"});
  form.addEventListener("submit",async e=>{
    e.preventDefault(); submit.disabled=true; statusEl.textContent="Working…";
    const email=document.getElementById("email").value.trim(), password=document.getElementById("password").value;
    const result=mode==="login"
      ? await window.oudSupabase.auth.signInWithPassword({email,password})
      : await window.oudSupabase.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname.replace("login.html","dashboard.html")}});
    if(result.error){statusEl.textContent=result.error.message; submit.disabled=false; return;}
    if(mode==="signup" && !result.data.session){statusEl.className="status ok";statusEl.textContent="Account created. Check your email to confirm it, then sign in.";submit.disabled=false;return;}
    location.href="dashboard.html";
  });
}
</script>
</body>
</html>
